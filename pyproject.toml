[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-registro-drift"
version = "0.1.0"
description = "Registro de modelo (MLflow ou arquivo local) e detecção de drift de dados (Evidently ou teste estatístico de desvio de média)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = {text = "MIT"}
authors = [{name = "Kelvin Oliveira"}]

[project.optional-dependencies]
mlflow = ["mlflow>=2.0"]
evidently = ["evidently>=0.4"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
mlops-registro-drift = "mlops_registro_drift.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
